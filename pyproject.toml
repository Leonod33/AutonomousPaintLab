[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-paint-lab"
version = "0.2.0"
description = "A screenshot-only autonomous art and variant-tournament experiment built on a custom PyGame Paint application"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=11.0",
  "pygame==2.6.1",
]

[tool.setuptools.packages.find]
where = ["src"]
